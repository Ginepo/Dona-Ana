<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menú | Doña Ana</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #fff8ef;
      color: #302119;
      font: 1rem/1.5 system-ui, sans-serif;
    }
    header { background: #713526; color: white; }
    header > div, main { max-width: 68rem; margin: auto; padding: 1.5rem; }
    h1, h2, h3, p { margin: 0 0 .65rem; }
    h1 { font-size: 2.5rem; }
    #filters { display: flex; flex-wrap: wrap; gap: .5rem; margin: 1rem 0; }
    button {
      min-height: 44px;
      padding: .5rem 1rem;
      border: 1px solid #713526;
      border-radius: 999px;
      background: white;
      color: #713526;
      font: inherit;
      cursor: pointer;
    }
    button[aria-pressed="true"] { background: #713526; color: white; }
    #menu {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 15rem), 1fr));
      gap: 1rem;
    }
    article { background: white; padding: 1rem; border: 1px solid #e9d8c9; border-radius: 1rem; }
    summary { cursor: pointer; min-height: 44px; padding: .55rem 0; }
    .sold-out { color: #8b2920; font-weight: 700; }
    .dish-photo {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      border-radius: .65rem;
      margin-bottom: .75rem;
    }
    #cart { margin-top: 1.5rem; padding: 1rem; background: white; border-radius: 1rem; }
    #cart-items { padding-left: 1.25rem; }
    #cart-items li { margin-bottom: .75rem; }
    input[type="number"] { width: 5rem; min-height: 44px; font: inherit; margin: .25rem; }
  </style>
  <script src="/cart.js" defer></script>
  <script src="/menu.js" defer></script>
</head>
<body>
  <header>
    <div>
      <h1>Doña Ana</h1>
      <p>Comida casera para recoger</p>
    </div>
  </header>
  <main>
    <h2>Menú</h2>
    <label for="pickup-date">Fecha de recogida</label>
    <select id="pickup-date" disabled></select>
    <div id="filters" role="group" aria-label="Filtrar por categoría"></div>
    <p id="status" role="status">Cargando el menú…</p>
    <section id="menu" aria-label="Platos"></section>
    <section id="cart" aria-labelledby="cart-heading">
      <h2 id="cart-heading">Carrito</h2>
      <ul id="cart-items"></ul>
      <p id="cart-status" role="status"></p>
      <p><strong>Total: <span id="cart-total">—</span></strong></p>
      <button id="accept-prices" type="button" hidden>Aceptar precios actualizados</button>
    </section>
  </main>
</body>
</html>
